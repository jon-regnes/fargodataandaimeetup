<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fargo Data &amp; AI — Terminal</title>
<meta name="description" content="Fargo's informal data and AI community. Type help.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--fg:#7dff9b;--dim:#3fae5a;--bg:#04100a;--hot:#ffd166;--err:#ff7a7a;--link:#7de3ff}
  body.amber{--fg:#ffb454;--dim:#b87a2a;--bg:#140b02;--hot:#fff0c4;--link:#ffd9a0}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000}
  body{font-family:VT323,ui-monospace,monospace;font-size:clamp(19px,2.3vw,24px);color:var(--fg);line-height:1.25;overflow:hidden}
  .crt{position:fixed;inset:0;background:radial-gradient(ellipse at center,var(--bg) 0%,#000 120%);display:flex;flex-direction:column}
  .crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(#0000 0 2px,#0004 2px 4px),radial-gradient(ellipse at center,#0000 55%,#000b 100%);animation:roll 8s linear infinite}
  .crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0;animation:flick 5s infinite}
  @keyframes flick{0%,93%,100%{opacity:0}94%{opacity:.03}96%{opacity:.015}}
  @keyframes roll{to{background-position:0 4px,0 0}}
  .bar{display:flex;justify-content:space-between;gap:12px;padding:8px clamp(12px,3vw,28px);border-bottom:1px solid var(--dim);color:var(--dim);font-size:.85em;text-shadow:none;z-index:2}
  .bar button{all:unset;cursor:pointer;color:var(--dim);text-decoration:underline}
  .bar button:hover{color:var(--fg)}
  #screen{flex:1;overflow-y:auto;padding:clamp(12px,3vw,28px);text-shadow:0 0 6px var(--fg),0 0 1px var(--fg);scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
  #out{white-space:pre-wrap;word-break:break-word;max-width:96ch}
  .dim{color:var(--dim)} .hot{color:var(--hot);text-shadow:0 0 8px var(--hot)} .err{color:var(--err)}
  #out a,.chip{color:var(--link);text-decoration:underline;cursor:pointer}
  #out a:hover{background:var(--link);color:#000}
  .row{display:flex;gap:.6ch;align-items:baseline;max-width:96ch}
  #in{all:unset;flex:1;caret-color:var(--fg);caret-shape:block;min-width:2ch}
  .caret{display:inline-block;width:.6ch;height:1em;background:var(--fg);vertical-align:-.12em;animation:b 1s steps(2) infinite;box-shadow:0 0 8px var(--fg)}
  @keyframes b{50%{opacity:0}}
  .chips{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px clamp(12px,3vw,28px) 12px;border-top:1px solid var(--dim);z-index:2}
  .chip{all:unset;cursor:pointer;color:var(--fg);border:1px solid var(--dim);padding:0 10px;font-size:.9em}
  .chip:hover,.chip:focus-visible{background:var(--fg);color:#000;text-shadow:none}
  .art{color:var(--hot);font-size:clamp(54px,12vw,120px);line-height:.9;letter-spacing:.04em;margin:.3em 0 .4em;text-shadow:0 0 14px var(--hot),0 0 40px var(--hot)}
  .evt{margin:.4em 0 .9em}
  @media(prefers-reduced-motion:reduce){.crt::before,.crt::after,.caret{animation:none}}
</style>
</head>
<body>
<div class="crt">
  <div class="bar"><span>fargo-data-ai v2026.1 — tty1</span><span><button id="theme">[ color: green ]</button> <button id="skip">[ skip intro ]</button></span></div>
  <div id="screen" tabindex="-1">
    <div id="out"></div>
    <label class="row" id="prompt" style="display:none"><span id="ps" class="hot">guest@fargo:~$</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input"></label>
  </div>
  <div class="chips" id="chips"></div>
</div>

<script src="../events.js"></script>
<script>
(function(){
  const M=window.MEETUP, out=document.getElementById('out'), inp=document.getElementById('in'),
        screen=document.getElementById('screen'), prompt=document.getElementById('prompt'), ps=document.getElementById('ps');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let skip=false, ready=false, mode='cmd', pending={}, hist=[], hi=0;

  document.getElementById('skip').onclick=()=>{skip=true};
  document.getElementById('theme').onclick=e=>{const a=document.body.classList.toggle('amber');e.target.textContent=`[ color: ${a?'amber':'green'} ]`;try{localStorage.setItem('fda-theme',a?'amber':'green')}catch(_){}};
  try{if(localStorage.getItem('fda-theme')==='amber'){document.body.classList.add('amber');document.getElementById('theme').textContent='[ color: amber ]'}}catch(_){}

  function scroll(){screen.scrollTop=screen.scrollHeight}
  function line(html='',cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;out.appendChild(d);scroll();return d}
  async function type(text,cls='',speed=14){
    const d=line('',cls);
    if(skip||reduce){d.textContent=text;scroll();return}
    for(const ch of text){d.textContent+=ch;if(skip){d.textContent=text;break}if(ch!==' ')await sleep(speed);if(Math.random()<.04)scroll()}
    scroll();
  }

  const FORTUNES=[
    "Garbage in, garbage out. But in Fargo, snow in, snow out.",
    "It's not overfitting if you just really love your training set.",
    "The wind in the Red River Valley is the only free GPU-cooling.",
    "There are two hard problems: cache invalidation, naming, and parking at the NDSU Research Park.",
    "Our model's confidence is 99%. Our model has never seen a Fargo winter.",
    "Always back up your data. Also your hotdish.",
    "A wood chipper is a very aggressive data pipeline. (Don't.)",
    "LLMs hallucinate. Meetups don't. Come to a meetup.",
    "Correlation is not causation, ya know? But it's a start, you bet.",
  ];

  const CMDS={
    help(){return [
`<span class="hot">Available commands</span>
  <a data-c="about">about</a>       what this is
  <a data-c="events">events</a>      what's on the calendar
  <a data-c="slack">slack</a>       join our Slack
  <a data-c="subscribe">subscribe</a>   join the email list
  <a data-c="fortune">fortune</a>     wisdom from the prairie
  <a data-c="clear">clear</a>       clean the screen
<span class="dim">tip: Tab completes. ↑ recalls. Or click anything underlined.</span>`]},
    about(){return [`<span class="hot">${M.esc(M.name)}</span>
${M.esc(M.tagline)}
${M.esc(M.blurb)}

<span class="dim">Bring a laptop, or just curiosity.</span>`]},
    events(){
      const up=M.upcoming();
      if(!up.length)return [`<span class="dim">No upcoming events. Run <a data-c="subscribe">subscribe</a> and we'll tell you the moment there is one.</span>`];
      return [`<span class="hot">${up.length} upcoming</span>`, ...up.map((e,i)=>{
        const t=e.url?`<a href="${M.esc(e.url)}" target="_blank" rel="noopener">${M.esc(e.topic)}</a>`:M.esc(e.topic);
        return `<div class="evt"><span class="hot">[${i+1}]</span> ${t}${e.external?' <span class="dim">(external event)</span>':''}
    <span class="dim">who:</span>   ${M.esc(e.presenter)}
    <span class="dim">when:</span>  ${M.esc(e.when)}
    <span class="dim">where:</span> ${M.esc(e.location)}</div>`})]},
    slack(){setTimeout(()=>window.open(M.slackUrl,'_blank','noopener'),300);
      return [`Opening Slack invite… <a href="${M.esc(M.slackUrl)}" target="_blank" rel="noopener">click here</a> if nothing happens.`]},
    subscribe(){mode='name';ps.textContent='your name (optional):';return [`<span class="hot">Joining the email list.</span> One short note when a meetup is scheduled. <span class="dim">(Ctrl+C to cancel)</span>`]},
    fortune(){return [FORTUNES[Math.floor(Math.random()*FORTUNES.length)]]},
    clear(){out.innerHTML='';return []},
    whoami(){return ['guest. Welcome. Grab a coffee.']},
    ls(){return ['about.txt   events.db   slack.lnk   hotdish.recipe   .winter  <span class="dim">(you can\'t escape it)</span>']},
    pwd(){return ['/home/guest/red-river-valley']},
    date(){return [new Date().toString()]},
    sudo(){return ['<span class="err">guest is not in the sudoers file. This incident will be reported to Slack.</span>']},
    'rm'(){return ['<span class="err">Nice try. This is a community, not production.</span>']},
    exit(){return ['<span class="dim">There is no exit. Only Slack.</span>']},
    hotdish(){return ['Cream of mushroom soup, tater tots, ground beef. Consensus reached.']},
    uffda(){return ['Uffda indeed.']},
  };

  async function run(raw){
    const v=raw.trim();
    // multi-step: subscribe flow
    if(mode==='name'){pending.name=v;mode='email';ps.textContent='email:';return}
    if(mode==='email'){
      try{await M.subscribe({name:pending.name,email:v});
        line(`<span class="hot">✓ You're on the list.</span> ${M.emailEndpoint?'':'<span class="dim">(demo mode: nothing was sent yet)</span>'}`);
        mode='cmd';ps.textContent='guest@fargo:~$';pending={};
      }catch(e){line(`<span class="err">${M.esc(e.message)}</span> Try again, or Ctrl+C.`)}
      return}
    line(`<span class="hot">guest@fargo:~$</span> ${M.esc(v)}`);
    if(!v)return;
    hist.push(v);hi=hist.length;
    const key=v.split(/\s+/)[0].toLowerCase();
    const fn=CMDS[key];
    if(!fn){line(`<span class="err">command not found: ${M.esc(key)}</span> — try <a data-c="help">help</a>`);return}
    for(const h of fn())line(h);
  }

  out.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c){e.preventDefault();inp.value=c;submit()}});
  function submit(){const v=inp.value;inp.value='';run(v)}
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){submit()}
    else if(e.key==='ArrowUp'&&mode==='cmd'){e.preventDefault();hi=Math.max(0,hi-1);inp.value=hist[hi]||''}
    else if(e.key==='ArrowDown'&&mode==='cmd'){e.preventDefault();hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}
    else if(e.key==='Tab'&&mode==='cmd'){e.preventDefault();const m=Object.keys(CMDS).filter(k=>k.startsWith(inp.value.toLowerCase()));if(m.length===1)inp.value=m[0]}
    else if(e.key==='c'&&e.ctrlKey&&mode!=='cmd'){mode='cmd';pending={};ps.textContent='guest@fargo:~$';line('^C');}
    else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML=''}
  });
  screen.addEventListener('click',()=>{if(getSelection().toString()==='')inp.focus()});

  const chips=document.getElementById('chips');
  [['about'],['events'],['slack'],['subscribe'],['help']].forEach(([c])=>{const b=document.createElement('button');b.className='chip';b.textContent=c;
    b.onclick=()=>{if(!ready)return;if(mode!=='cmd'){mode='cmd';pending={};ps.textContent='guest@fargo:~$'}inp.value=c;submit();inp.focus({preventScroll:true})};chips.appendChild(b)});

  // boot
  (async()=>{
    const boot=[
      ['BIOS v1.0 ........................ ok',8],
      ['mounting /dev/prairie ............. ok',8],
      ['loading neural_hotdish.ko ......... ok',8],
      ['checking wind speed: 24 mph gusting 41 ... ok',8],
      ['connecting to Red River Valley .... connected',8],
    ];
    for(const [t,s] of boot){await type(t,'dim',s);if(!skip&&!reduce)await sleep(90)}
    const a=document.createElement('div');a.className='art';a.innerHTML='FARGO<br>DATA <span style="color:var(--fg)">&amp;</span> AI';out.appendChild(a);
    line('');
    await type(`Welcome to ${M.name}.`,'hot',22);
    await type(M.tagline,'',10);
    line('');
    line('Type <a data-c="help">help</a>, or click a button below. Try <a data-c="events">events</a>.');
    prompt.style.display='flex';ready=true;inp.focus({preventScroll:true});scroll();
  })();
})();
</script>
</body>
</html>
